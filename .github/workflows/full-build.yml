# SPDX-License-Identifier: MIT
# The whole image and update bundle, built in stages that each fit a hosted runner's 6 h job limit. Each stage hands
# the shared state it added on to the later ones as an artifact (stage.yml); stages that do not depend on each other
# run side by side, each on its own 4 vCPU runner. A stage that runs out of time keeps what it built: "Re-run failed
# jobs" continues from there. A board test still happens on a maintainer's build host.
#
# Runs weekly, on demand, on the lock update pull request (the updates workflow starts it there, so a new lock is
# merged once it builds), and on a pull request when a maintainer adds the label full-build. A run from scratch takes
# about 10 runner hours. The last stage keeps all of the shared state as artifact sstate-full-<lock hash> for 14 days;
# a later run with the same lock file starts from it and builds only what changed. Artifacts are not tied to a
# branch, so the lock pull request's build also serves main once merged.
name: full-build

on:
  schedule:
    - cron: "23 1 * * 3"
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: full-build-${{ github.ref }}-${{ github.event.label.name || 'run' }}
  cancel-in-progress: false

jobs:
  # hashFiles() is not available where a reusable workflow is called; the caches are keyed on the lock file's hash.
  prepare:
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-build'
    runs-on: ubuntu-24.04
    outputs:
      lock: ${{ steps.lock.outputs.hash }}
      sstate-run: ${{ steps.sstate.outputs.run }}
    steps:
      - uses: actions/checkout@v5
      - id: lock
        run: echo "hash=${{ hashFiles('kas/bobcat-g285.lock.yml') }}" >> "$GITHUB_OUTPUT"

      # The newest sstate-full artifact for this lock file, only from scheduled and manual runs of this workflow in
      # this repository: pull request runs can come from forks, and their shared state must not reach other builds.
      - id: sstate
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK: ${{ steps.lock.outputs.hash }}
        run: |
          run=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=sstate-full-$LOCK&per_page=50" \
              --jq '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired | not) | .workflow_run.id'); do
            origin=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" \
              --jq '.event + " " + .path + " " + .head_repository.full_name')
            case "$origin" in
              "schedule .github/workflows/full-build.yml $GITHUB_REPOSITORY" | \
              "workflow_dispatch .github/workflows/full-build.yml $GITHUB_REPOSITORY")
                run=$id
                break
                ;;
            esac
          done
          echo "Shared state from: ${run:+run $run}${run:-the build workflow's cache}"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # Cross toolchain, kernel, U-Boot: the same targets as the build workflow.
  toolchain:
    needs: prepare
    uses: ./.github/workflows/stage.yml
    with:
      name: 1-toolchain
      targets: >-
        virtual/kernel virtual/bootloader libloragw-sx1302:do_package_qa bobcat-emmc:do_package_qa
        bobcat-rauc:do_package_qa bobcat-wifibt-firmware:do_package_qa
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}

  # The Rust toolchain (LLVM, rust, cargo, the target's std) through the smallest Rust recipe, and clang (bindgen in
  # chirpstack and concentratord), which needs LLVM too. do_package, not do_package_qa: QA follows RDEPENDS, and
  # lorawan-agent's pulls in chirpstack with everything below.
  rust:
    needs: [prepare, toolchain]
    uses: ./.github/workflows/stage.yml
    with:
      name: 2-rust
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      targets: lorawan-agent:do_package clang-native

  # Node.js for chirpstack's web UI: about 2 h of compiling on its own, over 4.5 h next to LLVM and clang.
  nodejs:
    needs: [prepare, toolchain]
    uses: ./.github/workflows/stage.yml
    with:
      name: 2-nodejs
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      targets: nodejs-native

  # The rest of the image's packages: nothing here needs Rust or Node.js. lorawan-gateway-config is left out, as it
  # depends on chirpstack at run time.
  userland:
    needs: [prepare, toolchain]
    uses: ./.github/workflows/stage.yml
    with:
      name: 2-userland
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      targets: >-
        packagegroup-core-boot packagegroup-core-ssh-openssh mosquitto redis avahi libgpiod i2c-tools ethtool htop
        nano zstd

  # ChirpStack and its companions. chirpstack's link (LTO) is the heaviest task of the build.
  chirpstack:
    needs: [prepare, rust, nodejs]
    uses: ./.github/workflows/stage.yml
    with:
      name: 3-chirpstack
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      targets: >-
        chirpstack-concentratord:do_package_qa chirpstack-mqtt-forwarder:do_package_qa
        chirpstack-udp-forwarder:do_package_qa chirpstack:do_package_qa

  # The rest of the userland, the image and the update bundle (signed with the throwaway CI keys).
  image:
    needs: [prepare, chirpstack, userland]
    uses: ./.github/workflows/stage.yml
    with:
      name: 4-image
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      targets: lorawan-gateway-image lorawan-gateway-bundle
      final: true
