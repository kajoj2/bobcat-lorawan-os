# SPDX-License-Identifier: MIT
# The whole image and update bundle, built in stages that each fit a hosted runner's 6 h job limit. Each stage hands
# the shared state it added on to the later ones as an artifact (stage.yml); stages that do not depend on each other
# run side by side, each on its own 4 vCPU runner. A stage that runs out of time keeps what it built: "Re-run failed
# jobs" continues from there. A board test still happens on a maintainer's build host.
#
# Runs nightly (skipped when the last successful run, less than a week old, built the same commit), on demand, on the
# lock update pull request (the updates workflow starts it there, so a new lock is merged once it builds), and on a
# pull request when a maintainer adds the label full-build. A run from scratch takes about 10 runner hours.
#
# The last stage keeps all of the shared state as artifact sstate-full-<lock hash> for 7 days; a later run with the
# same lock file starts from it and builds only what changed. Artifacts are not tied to a branch, so the lock pull
# request's build also serves main once merged. Shared state is only taken from, and only kept by, runs of this
# workflow in this repository: a pull request from a fork must not reach other builds.
name: full-build

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  pull_request:
    types: [labeled]
  # release.yml: the image with the project's update CA (variable RAUC_CA_CERT)
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      version:
        description: Release version (the tag) for the image and the bundle
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: full-build-${{ github.ref }}-${{ github.event.label.name || 'run' }}
  cancel-in-progress: false

jobs:
  # hashFiles() is not available where a reusable workflow is called; the caches are keyed on the lock file's hash.
  prepare:
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-build'
    runs-on: ubuntu-24.04
    outputs:
      lock: ${{ steps.lock.outputs.hash }}
      sstate-run: ${{ steps.sstate.outputs.run }}
      sstate-pattern: ${{ steps.sstate.outputs.pattern }}
      skip: ${{ steps.skip.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      - id: lock
        run: echo "hash=${{ hashFiles('kas/bobcat-g285.lock.yml') }}" >> "$GITHUB_OUTPUT"

      - id: skip
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/full-build.yml/runs"
          last=$(gh api "$runs?branch=$GITHUB_REF_NAME&status=success&per_page=1" \
            --jq '.workflow_runs[0] | select(.created_at > (now - 6 * 86400 | todate)) | .head_sha')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "$GITHUB_SHA was built by a successful run this week; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # The newest sstate-full artifact for this lock file; without one, the stage artifacts of the newest earlier run
      # (one that did not get to the end, or from before sstate-full). Shared state files are named by their hashes:
      # files another lock file needed only cost download time.
      - id: sstate
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOCK: ${{ steps.lock.outputs.hash }}
        run: |
          trusted() {
            [ "$1" != "$GITHUB_RUN_ID" ] &&
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1" --jq '.path + " " + .head_repository.full_name' |
              grep -qxE "\.github/workflows/(full-build|release)\.yml $GITHUB_REPOSITORY"
          }
          api="repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100"
          newest='sort_by(.created_at) | reverse | .[] | select(.expired | not)'
          run="" pattern="sstate-full-$LOCK"
          for id in $(gh api "$api&name=$pattern" --jq ".artifacts | $newest | .workflow_run.id"); do
            if trusted "$id"; then run=$id; break; fi
          done
          if [ -z "$run" ]; then
            for id in $(gh api "$api" --jq ".artifacts | map(select(.name | startswith(\"sstate-\"))) | $newest |
                .workflow_run.id" | awk '!seen[$0]++'); do
              if trusted "$id"; then run=$id pattern="sstate-*"; break; fi
            done
          fi
          if [ -n "$run" ]; then echo "Shared state: $pattern of run $run"; else echo "Shared state: build cache"; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "pattern=$pattern" >> "$GITHUB_OUTPUT"

  # Cross toolchain, kernel, U-Boot: the same targets as the build workflow.
  toolchain:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    uses: ./.github/workflows/stage.yml
    with:
      name: 1-toolchain
      targets: >-
        virtual/kernel virtual/bootloader libloragw-sx1302:do_package_qa bobcat-emmc:do_package_qa
        bobcat-rauc:do_package_qa bobcat-wifibt-firmware:do_package_qa
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      sstate-pattern: ${{ needs.prepare.outputs.sstate-pattern }}

  # The Rust toolchain (LLVM, rust, cargo, the target's std) through the smallest Rust recipe, and clang (bindgen in
  # chirpstack and concentratord), which needs LLVM too. do_package, not do_package_qa: QA follows RDEPENDS, and
  # lorawan-agent's pulls in chirpstack with everything below.
  rust:
    needs: [prepare, toolchain]
    uses: ./.github/workflows/stage.yml
    with:
      name: 2-rust
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      sstate-pattern: ${{ needs.prepare.outputs.sstate-pattern }}
      targets: lorawan-agent:do_package clang-native

  # Node.js for chirpstack's web UI: about 2 h of compiling on its own, over 4.5 h next to LLVM and clang.
  nodejs:
    needs: [prepare, toolchain]
    uses: ./.github/workflows/stage.yml
    with:
      name: 2-nodejs
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      sstate-pattern: ${{ needs.prepare.outputs.sstate-pattern }}
      targets: nodejs-native

  # The rest of the image's packages: nothing here needs Rust or Node.js. lorawan-gateway-config is left out, as it
  # depends on chirpstack at run time.
  userland:
    needs: [prepare, toolchain]
    uses: ./.github/workflows/stage.yml
    with:
      name: 2-userland
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      sstate-pattern: ${{ needs.prepare.outputs.sstate-pattern }}
      targets: >-
        packagegroup-core-boot packagegroup-core-ssh-openssh mosquitto redis avahi libgpiod i2c-tools ethtool htop
        nano zstd

  # ChirpStack and its companions. chirpstack's link (LTO) is the heaviest task of the build.
  chirpstack:
    needs: [prepare, rust, nodejs]
    uses: ./.github/workflows/stage.yml
    with:
      name: 3-chirpstack
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      sstate-pattern: ${{ needs.prepare.outputs.sstate-pattern }}
      targets: >-
        chirpstack-concentratord:do_package_qa chirpstack-mqtt-forwarder:do_package_qa
        chirpstack-udp-forwarder:do_package_qa chirpstack:do_package_qa

  # The rest of the userland, the image and the update bundle (signed with the throwaway CI keys).
  image:
    needs: [prepare, chirpstack, userland]
    uses: ./.github/workflows/stage.yml
    with:
      name: 4-image
      lock-hash: ${{ needs.prepare.outputs.lock }}
      sstate-run: ${{ needs.prepare.outputs.sstate-run }}
      sstate-pattern: ${{ needs.prepare.outputs.sstate-pattern }}
      targets: lorawan-gateway-image lorawan-gateway-bundle
      final: true
      ca-cert: ${{ inputs.release && vars.RAUC_CA_CERT || '' }}
      # A release's bundle is only signed with the project's key in release.yml: this artifact is not for installing
      images-name: ${{ inputs.release && 'images-unsigned' || 'images' }}
      version: ${{ inputs.version }}
