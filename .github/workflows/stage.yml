# SPDX-License-Identifier: MIT
# One stage of the staged full build (full-build.yml): restores the shared state cache and the shared state of the
# earlier stages of this run, builds the given targets, and uploads only the shared state files this stage added, as
# artifact sstate-<name>-<attempt>. The files go up as one uncompressed tar: shared state file names contain colons,
# which upload-artifact refuses.
# The build step has its own time limit below the job's, so the upload still runs when a stage runs out of time; a
# rerun of the failed jobs then continues from there.
name: stage

on:
  workflow_call:
    inputs:
      name:
        description: Stage name, also the artifact suffix
        type: string
        required: true
      targets:
        description: BitBake targets (recipe or recipe:do_task)
        type: string
        required: true
      build-minutes:
        description: Time limit of the build step
        type: number
        default: 300
      lock-hash:
        description: hashFiles of the lock file, which keys the shared state and downloads caches
        type: string
        required: true
      sstate-run:
        description: Run whose shared state to start from, or empty for the build workflow's cache
        type: string
        default: ""
      sstate-pattern:
        description: Artifacts of that run to take
        type: string
        default: ""
      final:
        description: The last stage, which uploads the images and the whole shared state for later runs
        type: boolean
        default: false
      ca-cert:
        description: Update CA certificate (PEM) to build into the image instead of the throwaway one, for a release
        type: string
        default: ""
      version:
        description: Release version (a tag like v0.1.0) for the image and the bundle; empty for "dev" and the build time
        type: string
        default: ""
      images-name:
        description: Name of the artifact with the image and the bundle (final stage)
        type: string
        default: images

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: ${{ inputs.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      # A stage needs up to ~50 GB (the image stage: all shared state plus the rootfs). Runners
      # have had from ~14 GB to ~90 GB free; remove the preinstalled SDKs only when space is short (takes 2 min).
      - name: Free disk space if needed
        run: |
          df -h /
          if [ "$(df --output=avail -BG / | tail -n 1 | tr -dc 0-9)" -lt 60 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
              /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google
            sudo docker image prune --all --force > /dev/null
            df -h /
          fi

      - uses: actions/checkout@v5

      - name: Set up kas-container
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          curl -fsSL -o "$RUNNER_TEMP/kas-container" https://raw.githubusercontent.com/siemens/kas/5.4/kas-container
          chmod +x "$RUNNER_TEMP/kas-container"
          echo "KAS_WORK_DIR=$RUNNER_TEMP/kas" >> "$GITHUB_ENV"
          echo "SSTATE=$RUNNER_TEMP/kas/build/sstate-cache" >> "$GITHUB_ENV"

      # A release image carries the project's update CA instead; its bundle is signed again by release.yml.
      - name: Throwaway update keys
        env:
          CA_CERT: ${{ inputs.ca-cert }}
        run: |
          tools/rauc-keys.sh "$KAS_WORK_DIR/rauc-keys" "CI throwaway"
          if [ -n "$CA_CERT" ]; then
            printf '%s\n' "$CA_CERT" > "$KAS_WORK_DIR/rauc-keys/ca.cert.pem"
            openssl x509 -in "$KAS_WORK_DIR/rauc-keys/ca.cert.pem" -noout -subject -enddate
          fi

      # The shared state of an earlier full build (full-build.yml's prepare job finds it), so that only what changed
      # since is built; or else the build workflow's cache.
      - name: Shared state of an earlier full build
        if: inputs.sstate-run != ''
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.sstate-pattern }}
          merge-multiple: true
          run-id: ${{ inputs.sstate-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/full

      - name: Restore the build workflow's cache
        if: inputs.sstate-run == ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SSTATE }}
          key: sstate-board-${{ inputs.lock-hash }}-
          restore-keys: sstate-board-${{ inputs.lock-hash }}-

      - name: Restore the build workflow's downloads cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.KAS_WORK_DIR }}/build/downloads
          key: downloads-${{ inputs.lock-hash }}-
          restore-keys: downloads-${{ inputs.lock-hash }}-

      - name: Shared state of the earlier stages
        uses: actions/download-artifact@v8
        with:
          pattern: sstate-*
          path: ${{ runner.temp }}/earlier
          merge-multiple: true

      # The list of what is there before the build: BitBake touches the shared state files it uses, so their times
      # cannot tell the new ones apart.
      - name: Unpack the earlier shared state
        run: |
          mkdir -p "$SSTATE"
          for t in "$RUNNER_TEMP"/full/*.tar "$RUNNER_TEMP"/earlier/*.tar; do
            [ -e "$t" ] || continue
            echo "$t: $(du -h "$t" | cut -f1)"
            tar -xf "$t" -C "$SSTATE"
            rm "$t"
          done
          cd "$SSTATE" && find . -type f ! -name '*.siginfo' | sort > "$RUNNER_TEMP/old-files"
          wc -l < "$RUNNER_TEMP/old-files"

      - name: Release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION#v}"
          case "$v" in ''|*[!0-9A-Za-z.+~-]*) echo "::error::Unusable version '$VERSION'"; exit 1 ;; esac
          printf '%s\n' 'header:' '  version: 14' 'local_conf_header:' '  release-version: |' \
            "    DISTRO_VERSION = \"$v\"" "    RAUC_BUNDLE_VERSION:pn-lorawan-gateway-bundle = \"$v\"" \
            > kas/release-version.yml
          cat kas/release-version.yml
          echo "BUILD_KAS=kas/ci-board.yml:kas/release-version.yml" >> "$GITHUB_ENV"

      - name: Build
        timeout-minutes: ${{ inputs.build-minutes }}
        run: |
          "$RUNNER_TEMP/kas-container" shell "${BUILD_KAS:-kas/ci-board.yml}" -c "bitbake ${{ inputs.targets }}"

      - name: Collect this stage's shared state
        if: success() || failure() || cancelled()
        run: |
          cd "$SSTATE"
          find . -type f ! -name '*.siginfo' | sort | comm -13 "$RUNNER_TEMP/old-files" - > "$RUNNER_TEMP/new-files"
          wc -l < "$RUNNER_TEMP/new-files"
          xargs -r -a "$RUNNER_TEMP/new-files" du -cb |
            awk '$2 == "total" { n += $1 } END { printf "%.1f GB\n", n / 1e9 }'
          mkdir -p "$RUNNER_TEMP/upload"
          if [ -s "$RUNNER_TEMP/new-files" ]; then
            tar -cf "$RUNNER_TEMP/upload/sstate-${{ inputs.name }}-${{ github.run_attempt }}.tar" \
              -T "$RUNNER_TEMP/new-files"
            du -h "$RUNNER_TEMP"/upload/*.tar
          fi

      - name: Upload this stage's shared state
        if: success() || failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          # One artifact per attempt: a rerun adds to what an attempt that ran out of time uploaded.
          name: sstate-${{ inputs.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upload
          # Shared state archives are compressed already.
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore

      # The image for a board test (the update bundle is signed with this job's throwaway keys: only a board built
      # with the same keys accepts it).
      - name: Upload the images
        if: inputs.final && success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.images-name }}
          path: |
            ${{ env.KAS_WORK_DIR }}/build/tmp/deploy/images/bobcat-g285/lorawan-gateway-image-*.rootfs.wic.xz
            ${{ env.KAS_WORK_DIR }}/build/tmp/deploy/images/bobcat-g285/lorawan-gateway-image-*.rootfs.wic.bmap
            ${{ env.KAS_WORK_DIR }}/build/tmp/deploy/images/bobcat-g285/lorawan-gateway-image-*.rootfs.manifest
            ${{ env.KAS_WORK_DIR }}/build/tmp/deploy/images/bobcat-g285/lorawan-gateway-bundle-bobcat-g285.raucb
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn

      # All shared state the image needed, for the next runs with the same lock file. Not from a fork's pull request.
      - name: Collect the whole shared state
        if: >-
          inputs.final && success() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p "$RUNNER_TEMP/full-out"
          tar -cf "$RUNNER_TEMP/full-out/sstate-full-${{ inputs.lock-hash }}.tar" -C "$SSTATE" --exclude='*.siginfo' .
          du -h "$RUNNER_TEMP"/full-out/*.tar

      - name: Upload the whole shared state
        if: >-
          inputs.final && success() &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v7
        with:
          name: sstate-full-${{ inputs.lock-hash }}
          path: ${{ runner.temp }}/full-out
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Build statistics
        if: success() || failure() || cancelled()
        run: |
          df -h /
          du -sh "$SSTATE" "$KAS_WORK_DIR"/build/downloads "$KAS_WORK_DIR"/build/tmp 2>/dev/null || true
          tail -n 30 "$KAS_WORK_DIR"/build/tmp/buildstats/*/build_stats 2>/dev/null || true
