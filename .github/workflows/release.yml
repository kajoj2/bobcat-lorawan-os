# SPDX-License-Identifier: MIT
# A release from a tag v*: the full build (full-build.yml) with the project's update CA built into the image, then,
# once a maintainer approves the release environment, the update bundle signed with the project's key, provenance
# attestations, and a GitHub release with the image and the bundle (docs/releasing.md).
#
# Settings it needs:
# - variable RAUC_CA_CERT: the update CA certificate (ca.cert.pem), public; the image only takes bundles signed
#   under it
# - environment release, with the maintainers as required reviewers and only v* tags allowed to deploy, holding
#   secret RAUC_SIGNING_KEY (key.pem) and variable RAUC_SIGNING_CERT (cert.pem, issued by that CA)
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Update CA certificate
        env:
          CA_CERT: ${{ vars.RAUC_CA_CERT }}
        run: |
          if [ -z "$CA_CERT" ]; then
            echo "::error::Variable RAUC_CA_CERT is not set: a release image needs the project's update CA"
            exit 1
          fi
          printf '%s\n' "$CA_CERT" | openssl x509 -noout -subject -enddate

  build:
    needs: check
    uses: ./.github/workflows/full-build.yml
    with:
      release: true
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      BUNDLE: build/lorawan-gateway-bundle-bobcat-g285.raucb
    steps:
      # The build's files, the bundle still signed with the build's throwaway key
      - uses: actions/download-artifact@v8
        with:
          name: images-unsigned
          path: build

      # The CVE report of the same image (full-build's cve job), published next to it when the check ran
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: cve-report
          path: cve

      - name: Install RAUC
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rauc > /dev/null
          rauc --version

      # The build signed the bundle with its throwaway key. The key only exists in this step, in a directory
      # nobody else on the runner can read, and is removed before the step ends.
      - name: Sign the update bundle
        env:
          KEY: ${{ secrets.RAUC_SIGNING_KEY }}
          CERT: ${{ vars.RAUC_SIGNING_CERT }}
          CA_CERT: ${{ vars.RAUC_CA_CERT }}
        run: |
          if [ -z "$KEY" ] || [ -z "$CERT" ]; then
            echo "::error::Environment release needs secret RAUC_SIGNING_KEY and variable RAUC_SIGNING_CERT"
            exit 1
          fi
          keys=$(mktemp -d)
          trap 'rm -rf "$keys"' EXIT
          (
            umask 077
            printf '%s\n' "$KEY" > "$keys/key.pem"
            printf '%s\n' "$CERT" > "$keys/cert.pem"
            printf '%s\n' "$CA_CERT" > "$keys/ca.cert.pem"
          )
          # The keyring as the gateway has it (meta-bobcat's system.conf): RAUC checks the new signature against it,
          # and the signing certificate is for code signing, not RAUC's default S/MIME purpose.
          printf '%s\n' '[system]' 'compatible=bobcat-g285' 'bootloader=noop' \
            '[keyring]' 'path=ca.cert.pem' 'check-purpose=codesign' > "$keys/system.conf"
          # --no-verify: the bundle's current signature is the build's throwaway one
          rauc --conf="$keys/system.conf" resign --no-verify --key "$keys/key.pem" --cert "$keys/cert.pem" \
            "$BUNDLE" "$keys/signed.raucb"
          # What a gateway checks before installing
          rauc --conf="$keys/system.conf" info "$keys/signed.raucb"
          mv "$keys/signed.raucb" "$BUNDLE"

      # Release file names carry the version: tag v0.1.0 gives lorawan-gateway-os-0.1.0-bobcat-g285.wic.xz.
      # bmaptool finds the .wic.bmap next to the .wic.xz by itself.
      - name: Name the files
        run: |
          base="lorawan-gateway-os-${GITHUB_REF_NAME#v}-bobcat-g285"
          mkdir images
          cp build/lorawan-gateway-image-bobcat-g285.rootfs.wic.xz "images/$base.wic.xz"
          cp build/lorawan-gateway-image-bobcat-g285.rootfs.wic.bmap "images/$base.wic.bmap"
          cp build/lorawan-gateway-image-bobcat-g285.rootfs.manifest "images/$base.manifest"
          cp "$BUNDLE" "images/$base.raucb"
          if [ -f cve/lorawan-gateway-image.cve.txt ]; then cp cve/lorawan-gateway-image.cve.txt "images/$base.cve.txt"; fi
          ls -l images

      - name: Checksums
        working-directory: images
        run: sha256sum -- * | tee SHA256SUMS

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: images/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.1.0-rc1) is a pre-release
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          # How to install comes first; the merged pull requests follow (--generate-notes appends them).
          base="lorawan-gateway-os-${GITHUB_REF_NAME#v}-bobcat-g285"
          docs="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs"
          cat > notes.md <<NOTES
          ## Install

          For a **Bobcat Miner 300, board revision G285** (serial number starts with \`285\`), EU868.

          1. Download \`$base.wic.xz\` (and \`.wic.bmap\`, \`SHA256SUMS\`); check it: \`sha256sum -c --ignore-missing SHA256SUMS\`.
          2. Write it to a microSD card (8 GB or more): [balenaEtcher](https://etcher.balena.io/) or Raspberry Pi Imager
             ("Use custom"), or \`bmaptool copy $base.wic.xz /dev/sdX\`. The eMMC is not touched.
          3. Card into the gateway, Ethernet if you have it, 12 V on. The front LED goes red, then blinks green (blue: no network).
          4. Set it up from a phone: join the Wi-Fi \`bobcat-setup-XXXX\` (about 2 minutes after power-on, only without a network),
             or open \`http://bobcat-g285.local/setup\` on your LAN.
          5. Panel \`http://bobcat-g285.local/\`, ChirpStack \`http://bobcat-g285.local:8080\` (admin / admin). SSH: add your public key
             on the panel (card "SSH keys"), then \`ssh root@bobcat-g285.local\`.

          Already running LoRaWAN Gateway OS? Panel → System update → From GitHub → Install (or upload \`$base.raucb\`).

          Guides: [flashing]($docs/flashing.md) · [setup wizard]($docs/setup.md) · [updates]($docs/updates.md) ·
          [troubleshooting]($docs/troubleshooting.md). Check where a file came from:
          \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`.

          NOTES
          gh release create "$GITHUB_REF_NAME" images/* -R "$GITHUB_REPOSITORY" --verify-tag $pre \
            --title "LoRaWAN Gateway OS $GITHUB_REF_NAME" --notes-file notes.md --generate-notes
