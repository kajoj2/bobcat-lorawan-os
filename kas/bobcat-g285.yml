# yaml-language-server: $schema=https://raw.githubusercontent.com/siemens/kas/master/kas/schema-kas.json
# SPDX-License-Identifier: MIT
#
# LoRaWAN gateway image for the Bobcat Miner 300, board revision G285 (RK3566).
#
#   kas build kas/bobcat-g285.yml          (or kas-container build ...)
#
# Yocto 6.0 "wrynose" (LTS). Every repository is pinned to a commit in bobcat-g285.lock.yml, which kas applies
# automatically; `kas lock kas/bobcat-g285.yml` refreshes it. Output:
# build/tmp/deploy/images/bobcat-g285/lorawan-gateway-image-bobcat-g285.rootfs.wic (+ .bmap), see docs/flashing.md.
header:
  version: 14

machine: bobcat-g285
distro: lorawan-os
target: lorawan-gateway-image

defaults:
  repos:
    branch: wrynose

repos:
  bobcat-lorawan-os:
    layers:
      meta-bobcat:
      meta-lorawan:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    layers:
      meta:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    layers:
      meta-arm:
      meta-arm-toolchain:

  # meta-rockchip has no wrynose branch: master moved to the next release (blacksail) on 2026-09-25, and the lock
  # pins the last commit before that, whose layer.conf is still compatible with wrynose.
  meta-rockchip:
    url: https://git.yoctoproject.org/meta-rockchip
    branch: master

local_conf_header:
  base: |
    CONF_VERSION = "2"
    INHERIT += "buildstats-summary"
    INHERIT += "image-buildinfo"
  diskmon: |
    BB_DISKMON_DIRS ??= "\
      STOPTASKS,${TMPDIR},1G,100K \
      STOPTASKS,${DL_DIR},1G,100K \
      STOPTASKS,${SSTATE_DIR},1G,100K \
      HALT,${TMPDIR},100M,1K \
      HALT,${DL_DIR},100M,1K \
      HALT,${SSTATE_DIR},100M,1K"
  images: |
    # Compressed image plus a bmap file for bmaptool (meta-rockchip adds wic and wic.bmap)
    WIC_COMPRESSION_EXTENSION = ".xz"
