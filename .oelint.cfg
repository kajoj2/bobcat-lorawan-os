# SPDX-License-Identifier: MIT
# oelint-adv settings for CI (.github/workflows/ci.yml); run from the repository root:
#   oelint-adv $(git ls-files '*.bb' '*.bbappend' '*.bbclass' '*.inc')
# Kept: the rules that catch mistakes (unknown or renamed variables, bad overrides, broken syntax). Suppressed: style
# preferences of the OE style guide that these layers do not follow, and the checks below that do not fit them.
# Deliberate exceptions to the kept rules are marked in place with `# nooelint: <rule>`.
[oelint]
release = wrynose
hide = info
quiet = True
relpaths = True
extra-layer =
  openembedded-layer
  meta-python
  networking-layer
  rauc
constantmods = +.oelint-constants.json
suppress =
  # Style: layout, order and optional fields of a recipe
  oelint.file.underscores
  oelint.var.order.DEPENDS
  oelint.var.order.SRC_URI
  oelint.vars.dependsordered
  oelint.vars.inconspaces
  oelint.vars.summary80chars
  oelint.tabs.notabs
  oelint.var.mandatoryvar.HOMEPAGE
  oelint.var.mandatoryvar.DESCRIPTION
  # Recipes that fetch nothing (images, bundles) need no SRC_URI
  oelint.var.mandatoryvar.SRC_URI
  # Our own files carry their SPDX header; a local LIC_FILES_CHKSUM path is intended
  oelint.var.licenseremotefile
  # Anonymous python is how the recipes refuse to build without the update keys
  oelint.task.noanonpython
  # Own patches in a public repository; DCO sign-off is on the commit (CONTRIBUTING.md)
  oelint.file.patchsignedoff
