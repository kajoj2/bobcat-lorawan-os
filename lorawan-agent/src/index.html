<!doctype html>
<!-- SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRaWAN gateway</title>
<style>
:root {
  --bg: #f5f6f4; --card: #ffffff; --text: #1d2420; --muted: #66706a; --line: #e2e5e1;
  --ok: #1f8a4c; --warn: #b7791f; --bad: #c0392b; --info: #2563c9; --accent: #0f766e;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121614; --card: #1b201d; --text: #e4e9e5; --muted: #8f9a93; --line: #2b322e;
          --ok: #3fbf72; --warn: #e0a640; --bad: #ef6b5b; --info: #6b9cf0; --accent: #2dd4bf; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 18px 16px 8px; max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap;
         align-items: baseline; gap: 6px 16px; }
h1 { font-size: 20px; margin: 0; }
header .sub { color: var(--muted); font-size: 13px; }
header a { margin-left: auto; color: var(--accent); font-weight: 600; text-decoration: none; }
main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 32px; display: grid; gap: 14px;
       grid-template-columns: 1fr; }
@media (min-width: 720px) { main { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1040px) { main { grid-template-columns: repeat(3, 1fr); } .span2 { grid-column: span 2; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
.wide { grid-column: 1 / -1; }
#health { display: flex; align-items: center; gap: 12px; }
#health .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
#health b { font-size: 17px; }
#health ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; min-width: 0; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
.st { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: middle; }
.ok { background: var(--ok); } .bad { background: var(--bad); } .warn { background: var(--warn); } .info { background: var(--info); }
.tok { color: var(--ok); } .tbad { color: var(--bad); }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.num { border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.num span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; }
.num b { font-size: 20px; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
.empty { color: var(--muted); }
td.r, th.r { text-align: right; }
svg { display: block; width: 100%; height: auto; }
svg .ok { fill: var(--ok); } svg .bad { fill: var(--bad); }
svg text { fill: var(--muted); font-size: 11px; font-family: system-ui, sans-serif; }
svg line { stroke: var(--line); }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 4px 0 10px; }
.bar i { display: block; height: 100%; background: var(--ok); }
.bar i.hi { background: var(--warn); } .bar i.full { background: var(--bad); }
.note { color: var(--muted); font-size: 13px; margin: 6px 0; }
.warnbox { border-left: 3px solid var(--warn); padding: 6px 10px; margin: 8px 0; font-size: 13px; }
.badbox { border-left: 3px solid var(--bad); padding: 6px 10px; margin: 8px 0; font-size: 13px; }
.files { margin: 6px 0 10px; padding-left: 18px; }
.files li { margin: 2px 0; }
a.dl { color: var(--accent); font-weight: 600; text-decoration: none; }
button, input[type=text], input[type=password], textarea { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; cursor: pointer; }
label.opt { display: block; margin: 4px 0; }
.form { display: grid; grid-template-columns: max-content minmax(0, 320px); gap: 6px 10px; align-items: center; margin: 8px 0; }
.form input[type=text], .form input[type=password] { width: 100%; box-sizing: border-box; }
@media (max-width: 520px) { .form { grid-template-columns: minmax(0, 1fr); } }
button.danger { background: var(--bad); color: #fff; border-color: var(--bad); font-weight: 600; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
details summary { cursor: pointer; color: var(--accent); font-weight: 600; margin: 8px 0; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; }
footer { max-width: 1100px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1 id="host">LoRaWAN gateway</h1>
  <span class="sub" id="os"></span>
  <a id="cs" href="#">ChirpStack →</a>
</header>
<main>
  <section class="card wide"><div id="health"><span class="dot warn"></span><div><b>Loading…</b></div></div></section>
  <section class="card"><h2>Gateway</h2><dl id="gateway"></dl></section>
  <section class="card"><h2>Radio</h2><div class="nums" id="nums"></div><dl id="radio"></dl></section>
  <section class="card"><h2>Services</h2><div id="services"></div></section>
  <section class="card wide"><h2>Frames per hour, last 24 h</h2><div id="history"></div></section>
  <section class="card span2"><h2>Channels</h2><div class="scroll" id="channels"></div></section>
  <section class="card"><h2>Duty cycle</h2><div id="duty"></div></section>
  <section class="card"><h2>Data rates</h2><div class="scroll" id="rates"></div></section>
  <section class="card"><h2>Downlinks</h2><div id="downlinks"></div></section>
  <section class="card"><h2>System</h2><dl id="system"></dl></section>
  <section class="card wide"><h2>Last frames</h2><div class="scroll" id="frames"></div></section>
  <section class="card wide"><h2>Network</h2><div id="net"></div></section>
  <section class="card wide" id="update-card" hidden><h2>System update</h2><div id="update"></div></section>
  <section class="card wide" id="forward-card" hidden><h2>Community networks</h2><div id="forward"></div></section>
  <section class="card wide" id="bridge-card" hidden><h2>Home Assistant (MQTT)</h2><div id="bridge"></div></section>
  <section class="card wide" id="storage-card" hidden><h2>Internal storage (eMMC)</h2><div id="storage"></div></section>
</main>
<footer id="foot"></footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dl = rows => rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("");
const ago = (now, t) => { const s = Math.max(0, now - t); return s < 90 ? `${s} s ago` : s < 5400 ? `${Math.round(s / 60)} min ago` : `${Math.round(s / 3600)} h ago`; };
const dur = s => { const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
  return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : `${m} min`; };
const mib = kb => `${Math.round(kb / 1024)} MiB`;
let gatewayId = "";
const LEVEL = { ok: ["ok", "All good"], starting: ["info", "Starting"], "no-network": ["info", "No network"], fault: ["bad", "Problem"] };

$("cs").href = `${location.protocol}//${location.hostname}:8080/`;

function render(d) {
  const [cls, label] = LEVEL[d.health.level] || ["warn", d.health.level];
  $("health").innerHTML = `<span class="dot ${cls}"></span><div><b>${label}</b>` +
    (d.health.problems.length ? `<ul>${d.health.problems.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "") + `</div>`;

  const g = d.gateway, s = d.system, r = d.radio;
  gatewayId = g.id || "";
  $("host").textContent = s.hostname || "LoRaWAN gateway";
  document.title = `${s.hostname} · LoRaWAN gateway`;
  $("os").textContent = `${s.os} · Linux ${s.kernel}`;
  $("gateway").innerHTML = dl([
    ["Gateway ID", `<span class="mono">${esc(g.id || "unknown")}</span>`],
    ["ChirpStack", g.registered ? `<span class="tok">registered</span>` : `<span class="empty">not registered yet</span>`],
    ["Forwarder", g.online === true ? `<span class="tok">online</span>` : g.online === false ? `<span class="tbad">offline</span>` : "unknown"],
    ["MQTT", g.mqtt_connected ? `<span class="tok">connected</span>` : `<span class="tbad">${esc(g.mqtt_error || "down")}</span>`],
    ...Object.entries(g.versions).map(([k, v]) => [k.replace(/_version$/, "").replace(/_/g, " "),
      `<span class="mono">${esc(v.replace(/^\s*Version:\s*/, "").replace(/;\s*$/, ""))}</span>`]),
  ]);

  const n = (label, v) => `<div class="num"><span>${label}</span><b>${v}</b></div>`;
  $("nums").innerHTML = n("RX", r.total.rx) + n("CRC OK", r.total.rx_ok) + n("TX", r.total.tx) + n("TX sent", r.total.tx_emitted);
  $("radio").innerHTML = dl([
    ["Counted", "since the agent started"],
    ["Last stats", r.last_stats_at ? `${ago(d.now, r.last_stats_at)}: rx ${r.last.rx} (ok ${r.last.rx_ok}), tx ${r.last.tx_emitted}` : `<span class="empty">none yet</span>`],
  ]);

  $("history").innerHTML = chart(d.now, r.history);

  const freqs = [...new Set([...r.channels.map(c => c.frequency), ...Object.keys(r.rx_per_frequency).map(Number), ...Object.keys(r.tx_per_frequency).map(Number)])].sort((a, b) => a - b);
  $("channels").innerHTML = freqs.length ? `<table><thead><tr><th>MHz</th><th>Channel</th><th class="r">RX</th><th class="r">TX</th></tr></thead><tbody>` +
    freqs.map(f => `<tr><td>${(f / 1e6).toFixed(1)}</td><td>${esc(r.channels.filter(c => c.frequency === f).map(c => c.kind).join(", ") || "not in the plan")}</td>` +
      `<td class="r">${r.rx_per_frequency[f] || 0}</td><td class="r">${r.tx_per_frequency[f] || 0}</td></tr>`).join("") + `</tbody></table>`
    : `<p class="empty">No channel plan found.</p>`;

  const mods = [...new Set([...Object.keys(r.rx_per_modulation), ...Object.keys(r.tx_per_modulation)])].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
  $("rates").innerHTML = mods.length ? `<table><thead><tr><th>Data rate</th><th class="r">RX</th><th class="r">TX</th></tr></thead><tbody>` +
    mods.map(m => `<tr><td>${esc(m)}</td><td class="r">${r.rx_per_modulation[m] || 0}</td><td class="r">${r.tx_per_modulation[m] || 0}</td></tr>`).join("") + `</tbody></table>`
    : `<p class="empty">Nothing received or sent yet.</p>`;

  const results = Object.entries(r.downlink_results);
  $("downlinks").innerHTML = results.length ? dl(results.map(([k, v]) => [k.replace(/_/g, " ").toLowerCase(), `<span class="${k === "OK" ? "tok" : "tbad"}">${v}</span>`]))
    : `<p class="empty">No downlinks sent yet. Join accepts and confirmed-uplink acks show up here, with errors such as “too late” or “duty cycle overflow”.</p>`;

  const dc = r.duty_cycle;
  $("duty").innerHTML = dc && dc.bands.length ? `<div class="empty" style="margin-bottom:6px">${esc(dc.regulation)}, per ${Math.round(dc.window_s / 60)} min</div>` +
    dc.bands.map(b => { const pct = b.load_max_ms ? 100 * b.load_tracked_ms / b.load_max_ms : 0;
      return `<div>${esc(b.name)} <span class="empty">${(b.frequency_min / 1e6).toFixed(3)}–${(b.frequency_max / 1e6).toFixed(3)} MHz · ${(b.load_tracked_ms / 1000).toFixed(1)} of ${(b.load_max_ms / 1000).toFixed(0)} s (${pct.toFixed(1)} %)</span></div>` +
        `<div class="bar"><i class="${pct >= 90 ? "full" : pct >= 60 ? "hi" : ""}" style="width:${Math.min(100, pct).toFixed(1)}%"></i></div>`; }).join("")
    : `<p class="empty">No transmissions tracked yet.</p>`;

  $("frames").innerHTML = r.frames.length ? `<table><thead><tr><th>When</th><th>MHz</th><th>Ch</th><th>Data rate</th><th>CR</th><th>RSSI</th><th>SNR</th><th>CRC</th><th>Type</th><th>Device</th><th>FCnt</th><th>Bytes</th></tr></thead><tbody>` +
    r.frames.map(f => `<tr><td>${ago(d.now, f.at)}</td><td>${(f.frequency / 1e6).toFixed(1)}</td><td>${f.channel}</td><td>${esc(f.modulation)}</td><td>${esc(f.code_rate)}</td><td>${f.rssi} dBm</td><td>${f.snr} dB</td>` +
      `<td class="${f.crc_status === 2 ? "tok" : "tbad"}">${["none", "bad", "ok"][f.crc_status] || f.crc_status}</td><td>${esc(f.kind)}</td>` +
      `<td class="mono">${esc(f.device)}</td><td>${f.f_cnt ?? ""}</td><td>${f.size}</td></tr>`).join("") + `</tbody></table>`
    : `<p class="empty">No frames heard since the agent started. LoRaWAN devices nearby show up here.</p>`;

  $("services").innerHTML = s.services.map(x => `<div><span class="st ${x.state === "active" ? "ok" : "bad"}"></span>${esc(x.unit)} <span class="empty">${x.state === "active" ? "" : esc(x.state)}</span></div>`).join("");

  $("net").innerHTML = s.interfaces.map(i => {
    const st = i.carrier ? "ok" : i.up ? "warn" : "bad";
    const bits = [i.carrier ? "link" : i.up ? "up, no link" : "down"];
    if (i.speed_mbps) bits.push(`${i.speed_mbps} Mb/s`);
    if (i.ssid) bits.push(`“${esc(i.ssid)}”`);
    if (i.signal_dbm != null) bits.push(`${i.signal_dbm} dBm`);
    if (i.default_route) bits.push("default route");
    return `<div style="margin-bottom:8px"><span class="st ${st}"></span><b>${esc(i.name)}</b> <span class="empty">${bits.join(" · ")}</span>` +
      [...i.ipv4, ...i.ipv6].map(a => `<div class="mono" style="padding-left:16px">${esc(a)}</div>`).join("") + `</div>`;
  }).join("");

  $("system").innerHTML = dl([
    ["Uptime", dur(s.uptime_s)],
    ["Load", s.load.map(x => x.toFixed(2)).join(" ")],
    ["Memory", `${mib(s.mem_available_kb)} free of ${mib(s.mem_total_kb)}`],
    ["Disk /", `${mib(s.disk_used_kb)} used of ${mib(s.disk_total_kb)}`],
    ...s.temps.map(t => [t.name, `${t.celsius.toFixed(1)} °C`]),
  ]);
  $("foot").textContent = `lorawan-agent ${d.agent_version} · refreshed ${new Date().toLocaleTimeString()} · text report: lorawan-diag`;
}

// 24 hourly bars, CRC OK below and bad CRC on top; hours without stats are gaps.
function chart(now, history) {
  if (!history.length) return `<p class="empty">Collecting: one bar per hour from the concentrator's stats.</p>`;
  const W = 720, H = 150, top = 10, bottom = 24, left = 34, slot = (W - left) / 24;
  const hour0 = now - now % 3600 - 23 * 3600;
  const byStart = Object.fromEntries(history.map(h => [h.start, h]));
  const max = Math.max(1, ...history.map(h => h.rx));
  const y = v => top + (H - top - bottom) * (1 - v / max);
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Frames received per hour">`;
  for (const v of [0, max / 2, max]) {
    out += `<line x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${left - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`;
  }
  for (let i = 0; i < 24; i++) {
    const start = hour0 + i * 3600, h = byStart[start], x = left + i * slot + 2, w = slot - 4;
    if (h) {
      const ok = Math.min(h.rx_ok, h.rx);
      out += `<rect class="ok" x="${x}" width="${w}" y="${y(ok)}" height="${y(0) - y(ok)}"><title>${new Date(start * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}: ${h.rx} received, ${ok} CRC OK, ${h.tx} sent</title></rect>`;
      if (h.rx > ok) out += `<rect class="bad" x="${x}" width="${w}" y="${y(h.rx)}" height="${y(ok) - y(h.rx)}"/>`;
    }
    if (i % 6 === 0 || i === 23) out += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="middle">${new Date(start * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</text>`;
  }
  return out + `</svg>`;
}

async function tick() {
  try {
    const res = await fetch("api/status", { cache: "no-store" });
    render(await res.json());
  } catch (e) {
    $("health").innerHTML = `<span class="dot bad"></span><div><b>No answer from the gateway</b><ul><li>${esc(e.message)}</li></ul></div>`;
  }
}
tick();
setInterval(tick, 5000);

// --- System update: A/B slots with RAUC ---------------------------------------------------------------------------
let updateTimer = null, updateBusy = false, uploadPct = null;

function slotRows(d) {
  // rauc status JSON: slots is a list of { "rootfs.0": {...} }
  const slots = ((d.rauc && d.rauc.slots) || []).map(o => Object.entries(o)[0]).filter(Boolean)
    .filter(([name]) => name.startsWith("rootfs."));
  return slots.map(([name, s]) => {
    const st = s.slot_status || {}, b = st.bundle || {}, inst = st.installed || {};
    const running = s.bootname === d.booted;
    const next = d.rauc && d.rauc.boot_primary === name;
    return `<tr><td><b>${esc(s.bootname || name)}</b>${running ? ` <span class="tok">running</span>` : ""}${next && !running ? ` <span class="tok">next boot</span>` : ""}</td>` +
      `<td class="mono">${esc(b.version || (running ? "installed by hand" : "–"))}</td>` +
      `<td>${inst.timestamp ? esc(inst.timestamp.replace("T", " ").replace(/\..*|Z$/, "")) : "–"}</td>` +
      `<td>${s.boot_status === "good" ? `<span class="tok">good</span>` : s.boot_status === "bad" ? `<span class="tbad">bad</span>` : esc(s.boot_status || "–")}</td></tr>`;
  }).join("");
}

function renderUpdate(d) {
  $("update-card").hidden = !d.available;
  if (!d.available) return;
  const i = d.install || {};
  updateBusy = i.state === "uploading" || i.state === "installing";
  let h = d.default_password ? `<div class="warnbox"><b>ChirpStack still has its default password (admin/admin)</b>, which also ` +
    `lets anyone on your network install a system here (only bundles signed with your build's key are accepted). Change it in the ` +
    `<a class="dl" href="${esc($("cs").href)}">ChirpStack web interface</a>.</div>` : "";
  h += `<p>Two system slots, A and B: an update goes into the one not running, and the gateway restarts into it. ` +
    `If the new system does not come up three times in a row, it goes back to the old one by itself. Settings, ChirpStack data and the Wi-Fi network stay.</p>` +
    `<div class="scroll"><table><tr><th>Slot</th><th>Version</th><th>Installed</th><th>Boot</th></tr>${slotRows(d)}</table></div>`;
  if (uploadPct !== null) {
    h += `<p><b>Uploading: ${uploadPct}%</b></p><div class="bar"><i style="width:${uploadPct}%"></i></div>`;
  } else if (i.state === "installing" || i.state === "uploading") {
    h += `<p><b>Installing: ${i.percent}%</b>, ${esc(i.message)}</p><div class="bar"><i style="width:${i.percent}%"></i></div>` +
      `<p class="note">The gateway keeps working meanwhile. Do not power off.</p>`;
  } else if (i.state === "done") {
    h += `<div class="warnbox"><b>Installed.</b> ${esc(i.message)}</div>` +
      `<p><button class="primary" id="upd-reboot">Restart now</button> <span class="note" id="upd-msg"></span></p>`;
  } else if (i.state === "failed") {
    h += `<div class="badbox"><b>The update failed:</b> ${esc(i.message)}. Nothing changed: the gateway keeps running this system.</div>`;
  }
  if (!updateBusy && uploadPct === null) {
    h += `<details${i.state === "done" ? "" : " open"}><summary>Install an update</summary>` +
      `<p>An update bundle (<span class="mono">.raucb</span>) built for this gateway and signed with the key its system trusts; ` +
      `anything else is refused before the slot is touched.</p>` +
      `<p><input type="file" id="upd-file" accept=".raucb"> <button class="primary" id="upd-go" disabled>Upload and install</button></p>` +
      `<p class="note" id="upd-note">Asks for a ChirpStack login (the account you use on port 8080; admin/admin until you change it).</p></details>`;
  }
  const open = document.querySelector("#update details")?.open;
  const file = $("upd-file") && $("upd-file").files[0];
  $("update").innerHTML = h;
  if (open !== undefined && document.querySelector("#update details")) document.querySelector("#update details").open = open;
  if ($("upd-file")) {
    $("upd-file").addEventListener("change", () => { $("upd-go").disabled = !$("upd-file").files.length; });
    $("upd-go").addEventListener("click", uploadBundle);
    if (file) { const dt = new DataTransfer(); dt.items.add(file); $("upd-file").files = dt.files; $("upd-go").disabled = false; }
  }
  if ($("upd-reboot")) $("upd-reboot").addEventListener("click", rebootNow);
}

async function uploadBundle() {
  const file = $("upd-file").files[0], note = $("upd-note");
  if (!file) return;
  $("upd-go").disabled = true;
  // Log in first (the browser shows its dialog).
  const r = await fetch("api/update/login", { cache: "no-store" }).catch(e => ({ ok: false, text: async () => e.message }));
  if (!r.ok) { note.textContent = await r.text(); $("upd-go").disabled = false; return; }
  const xhr = new XMLHttpRequest();
  xhr.open("POST", "api/update/upload");
  xhr.setRequestHeader("Content-Type", "application/octet-stream");
  xhr.upload.onprogress = e => { if (e.lengthComputable) { uploadPct = Math.floor(100 * e.loaded / e.total); updateFetch(); } };
  xhr.onloadend = () => { uploadPct = null; if (xhr.status !== 202 && $("upd-note")) $("upd-note").textContent = xhr.responseText || "upload failed"; updateFetch(); };
  uploadPct = 0;
  xhr.send(file);
}

async function rebootNow() {
  $("upd-reboot").disabled = true;
  const r = await fetch("api/update/reboot", { method: "POST" }).catch(e => ({ ok: false, text: async () => e.message }));
  $("upd-msg").textContent = r.ok ? "Restarting: this page comes back in about a minute." : await r.text();
}

let updateLast = null;
async function updateFetch() {
  // While uploading, redraw from the last answer (the gateway is busy receiving)
  if (uploadPct !== null && updateLast) return renderUpdate(updateLast);
  try {
    const r = await fetch("api/update", { cache: "no-store" });
    if (r.ok) { updateLast = await r.json(); renderUpdate(updateLast); }
  } catch (e) { /* the status card already shows a dead gateway */ }
}
async function updatePoll() {
  clearTimeout(updateTimer);
  await updateFetch();
  updateTimer = setTimeout(updatePoll, updateBusy ? 2000 : 30000);
}
updatePoll();

// --- Community networks: forwarding to The Things Network and others (chirpstack-udp-forwarder) -----------------
const FSTATE = { connected: ["ok", "connected"], starting: ["info", "starting"], "no-answer": ["bad", "no answer"], stopped: ["bad", "forwarder not running"] };
let forwardTimer = null, forwardEditing = false;

function renderForward(d) {
  $("forward-card").hidden = false;
  if (forwardEditing) return; // do not throw away what is being typed
  const on = d.servers.map(x => x.server);
  let h = d.default_password ? `<div class="warnbox"><b>ChirpStack still has its default password (admin/admin).</b> ` +
    `Change it in the <a class="dl" href="${esc($("cs").href)}">ChirpStack web interface</a> (top right, admin → Change password). ` +
    `Until then anyone on your network can log in there.</div>` : "";
  h += `<p>Also send the frames this gateway hears to a community network, so people nearby can use it for their own ` +
    `sensors. The local ChirpStack keeps getting every frame; each network only takes its own devices' frames ` +
    `(The Things Network also passes others on through Packet Broker).</p>`;
  if (d.servers.length) {
    h += `<div class="scroll"><table><tr><th>Server</th><th>State</th><th class="r">Uplinks sent</th><th class="r">Downlinks</th><th>Last answer</th></tr>` +
      d.servers.map(x => { const [c, l] = FSTATE[x.state] || ["warn", x.state];
        return `<tr><td>${esc(x.label || x.server)}${x.label ? `<br><span class="note mono">${esc(x.server)}</span>` : ""}</td>` +
          `<td><span class="st ${c}"></span>${l}</td><td class="r">${x.uplinks}</td><td class="r">${x.downlinks}</td>` +
          `<td>${x.last_answer ? ago(d.now, x.last_answer) : "–"}</td></tr>`; }).join("") + `</table></div>` +
      `<p class="note">Counts since the forwarder started. “Connected” means the server answers the keepalives; TTN answers even for a gateway it does not know and then drops its frames, so check the gateway's status in the TTN Console too. “No answer”: the server is unreachable or UDP port 1700 is blocked.</p>`;
  } else {
    h += `<p class="note">Off: nothing leaves the gateway.</p>`;
  }
  const custom = on.filter(x => !d.presets.some(p => p.server === x));
  h += `<details${d.servers.length ? "" : " open"}><summary>Choose networks</summary>` +
    d.presets.map(p => `<label class="opt"><input type="checkbox" name="fwd" value="${esc(p.server)}"${on.includes(p.server) ? " checked" : ""}> ${esc(p.label)}</label>`).join("") +
    `<p><label>Other servers (Semtech UDP, host:port, one per line):<br><textarea id="fwd-custom" rows="2" cols="40" class="mono">${esc(custom.join("\n"))}</textarea></label></p>` +
    `<p><button class="primary" id="fwd-save">Save</button> <span class="note" id="fwd-msg"></span></p>` +
    `<p><b>Register the gateway on The Things Network</b> (once, in the <a class="dl" href="https://console.cloud.thethings.network/" target="_blank" rel="noopener">TTN Console</a>, pick the cluster chosen above): ` +
    `Gateways → Register gateway, Gateway EUI <span class="mono">${esc(gatewayId || "(see Gateway above)")}</span>, ` +
    `frequency plan for your region (Europe: “Europe 863-870 MHz (SF9 for RX2 - recommended)”). Frames from an unregistered gateway are dropped.</p>` +
    `</details>`;
  const open = document.querySelector("#forward details")?.open;
  $("forward").innerHTML = h;
  if (open !== undefined) document.querySelector("#forward details").open = open;
  const editing = () => { forwardEditing = true; };
  document.querySelectorAll("#forward input, #forward textarea").forEach(x => x.addEventListener("input", editing));
  $("fwd-save").addEventListener("click", saveForward);
}

async function saveForward() {
  const msg = $("fwd-msg"), body = new URLSearchParams();
  document.querySelectorAll("#forward input[name=fwd]:checked").forEach(x => body.append("server", x.value));
  $("fwd-custom").value.split(/[\s,]+/).filter(Boolean).forEach(x => body.append("server", x));
  $("fwd-save").disabled = true;
  try {
    const r = await fetch("api/forward", { method: "POST", body });
    msg.textContent = await r.text();
    if (r.ok) forwardEditing = false;
  } catch (e) { msg.textContent = e.message; }
  if ($("fwd-save")) $("fwd-save").disabled = false;
  if (!forwardEditing) setTimeout(forward, 1500);
}

async function forward() {
  clearTimeout(forwardTimer);
  try {
    const r = await fetch("api/forward", { cache: "no-store" });
    if (r.ok) renderForward(await r.json());
  } catch (e) { /* the status card already shows a dead gateway */ }
  forwardTimer = setTimeout(forward, 10000);
}
forward();

// --- Home Assistant: Mosquitto bridge to another MQTT broker -----------------------------------------------------
const BSTATE = { connected: ["ok", "connected"], disconnected: ["bad", "not connected (retrying)"], unknown: ["info", "connecting…"] };
let bridgeTimer = null, bridgeEditing = false;

function renderBridge(d) {
  $("bridge-card").hidden = false;
  if (bridgeEditing) return; // do not throw away what is being typed
  const p = d.prefix || "";
  let h = `<p>Send what ChirpStack publishes for your devices (uplinks with decoded values, joins, acknowledgements) to ` +
    `another MQTT broker, such as Home Assistant's Mosquitto add-on. The gateway connects out to that broker; its own ` +
    `broker stays closed to the network.</p>`;
  if (d.configured) {
    const [c, l] = BSTATE[d.state] || ["warn", d.state];
    h += `<dl><dt>Broker</dt><dd class="mono">${esc(d.server)}${d.tls ? " (TLS)" : ""}</dd>` +
      `<dt>State</dt><dd><span class="st ${c}"></span>${l}${d.since ? ` · ${ago(d.now, d.since)}` : ""}</dd>` +
      `<dt>Uplinks on</dt><dd class="mono">${esc(p)}application/&lt;application ID&gt;/device/&lt;DevEUI&gt;/event/up</dd>` +
      (d.downlinks ? `<dt>Downlinks from</dt><dd class="mono">${esc(p)}application/&lt;application ID&gt;/device/&lt;DevEUI&gt;/command/down</dd>` : "") +
      `<dt>Client ID</dt><dd class="mono">${esc(d.client_id)}</dd></dl>` +
      `<p class="note">“Not connected”: check the address, the user and password (a user of the broker; in Home Assistant, a user ` +
      `for the Mosquitto add-on), and that the broker's port is reachable from the gateway.</p>`;
  } else {
    h += `<p class="note">Off: nothing is sent.</p>`;
  }
  h += `<details${d.configured ? "" : " open"}><summary>${d.configured ? "Change" : "Connect"}</summary><div class="form">` +
    `<label for="br-server">Broker</label><input type="text" id="br-server" placeholder="homeassistant.local or host:port" value="${esc(d.server)}">` +
    `<label for="br-user">User name</label><input type="text" id="br-user" autocomplete="off" value="${esc(d.username)}">` +
    `<label for="br-pass">Password</label><input type="password" id="br-pass" autocomplete="new-password" placeholder="${d.password_set ? "unchanged" : ""}">` +
    `<label for="br-prefix">Topic prefix</label><input type="text" id="br-prefix" class="mono" value="${esc(p)}">` +
    `</div>` +
    `<label class="opt"><input type="checkbox" id="br-tls"${d.tls ? " checked" : ""}> TLS (the broker's certificate must be signed by a public CA; port 8883 by default)</label>` +
    `<label class="opt"><input type="checkbox" id="br-down"${d.downlinks ? " checked" : ""}> Accept downlinks from that broker</label>` +
    `<p><button class="primary" id="br-save">Save</button>${d.configured ? ` <button id="br-off">Turn off</button>` : ""} <span class="note" id="br-msg"></span></p>` +
    `<p class="note">Saving asks for a ChirpStack login (the account you use on port 8080; admin/admin until you change it) and restarts the gateway's MQTT broker (a few seconds). ` +
    `Without a port: 1883, or 8883 with TLS. The password is stored on the gateway and never shown again; leave it empty to keep it.</p></details>`;
  const open = document.querySelector("#bridge details")?.open;
  $("bridge").innerHTML = h;
  if (open !== undefined) document.querySelector("#bridge details").open = open;
  const editing = () => { bridgeEditing = true; };
  document.querySelectorAll("#bridge input").forEach(x => x.addEventListener("input", editing));
  $("br-save").addEventListener("click", () => saveBridge(false));
  if ($("br-off")) $("br-off").addEventListener("click", () => saveBridge(true));
}

async function saveBridge(off) {
  const msg = $("br-msg"), body = new URLSearchParams();
  if (off) body.append("action", "off");
  else {
    body.append("server", $("br-server").value);
    body.append("username", $("br-user").value);
    body.append("password", $("br-pass").value);
    body.append("prefix", $("br-prefix").value);
    if ($("br-tls").checked) body.append("tls", "on");
    if ($("br-down").checked) body.append("downlinks", "on");
  }
  document.querySelectorAll("#bridge button").forEach(b => b.disabled = true);
  try {
    // Ask for the login first (the browser shows its dialog).
    let r = await fetch("api/bridge/login", { cache: "no-store" });
    if (r.ok) r = await fetch("api/bridge/save", { method: "POST", body });
    msg.textContent = await r.text();
    if (r.ok) bridgeEditing = false;
  } catch (e) { msg.textContent = e.message; }
  document.querySelectorAll("#bridge button").forEach(b => b.disabled = false);
  if (!bridgeEditing) setTimeout(bridge, 3000);
}

async function bridge() {
  clearTimeout(bridgeTimer);
  try {
    const r = await fetch("api/bridge", { cache: "no-store" });
    if (r.ok) renderBridge(await r.json());
  } catch (e) { /* the status card already shows a dead gateway */ }
  bridgeTimer = setTimeout(bridge, 10000);
}
bridge();

// --- Internal storage (eMMC): backups and install ---------------------------------------------------------------
const gb = b => b >= 1e9 ? `${(b / 1e9).toFixed(1)} GB` : `${Math.max(1, Math.round(b / 1e6))} MB`;
const CONTENT = { factory: "Bobcat factory system", ours: "LoRaWAN Gateway OS (installed from the card)", empty: "empty", other: "unknown contents" };
let storageTimer = null, installing = false;

function backupItems(d) {
  // The "essentials": everything needed to put the eMMC back as it was, without its free space.
  const items = [["head", "partition table, boot loader, first 16 MiB", 16e6]];
  for (const p of d.parts) items.push([`p${p.n}`, `partition ${p.n} “${p.name}” (${p.fs === "ext4" ? "used blocks only" : "raw"})`, p.used]);
  items.push(["tail", "backup partition table", 17e3], ["boot0", "eMMC boot partition 0", 4e6], ["boot1", "eMMC boot partition 1", 4e6]);
  return items;
}

function renderStorage(d) {
  $("storage-card").hidden = !d.available;
  if (!d.available) return;
  const inst = d.install || {};
  installing = inst.state === "running";
  let h = (d.default_password ? `<div class="warnbox"><b>ChirpStack still has its default password (admin/admin)</b>, so anyone on ` +
    `your network can download these backups and install here. Change it in the <a class="dl" href="${esc($("cs").href)}">ChirpStack web interface</a>.</div>` : "") +
    `<dl>` + dl([
    ["Running from", d.boot === "sd" ? "the SD card" : d.boot === "emmc" ? "the eMMC" : esc(d.boot)],
    ["eMMC", d.emmc === "present" ? `${gb(d.emmc_bytes)}, ${esc(CONTENT[d.content] || d.content)}` : "not found"],
  ]) + `</dl>`;

  if (inst.state === "running") {
    const pct = inst.steps ? Math.round(100 * (inst.step - 1) / inst.steps) : 0;
    h += `<p><b>Installing: step ${inst.step} of ${inst.steps}</b>, ${esc(inst.message)}</p><div class="bar"><i style="width:${pct}%"></i></div>` +
      `<p class="note">Takes a few minutes. Do not power off. The gateway services pause for about a minute while the system is copied.</p>`;
  } else if (inst.state === "done") {
    h += `<div class="warnbox"><b>Installed.</b> ${esc(inst.message)}</div>`;
  } else if (inst.state === "failed") {
    h += `<div class="badbox"><b>The install failed</b> at step ${inst.step} of ${inst.steps}: ${esc(inst.message)}. ` +
      `The gateway keeps running from the SD card; the eMMC has no boot loader now, so the card still boots. Details: <span class="mono">journalctl -u bobcat-emmc-install</span>, <span class="mono">/run/bobcat-emmc/log</span>.</div>`;
  }

  if (d.emmc === "present" && d.content !== "empty" && !installing) {
    const items = backupItems(d);
    const total = items.reduce((a, [, , b]) => a + b, 0);
    h += `<details${d.content === "factory" ? " open" : ""}><summary>Back up the eMMC</summary>` +
      `<p class="note">Downloads ask for a ChirpStack login (the account you use on port 8080; admin/admin until you change it). Back up before installing: the install erases the whole eMMC.</p>` +
      `<p><b>Essentials</b>: everything needed to put the eMMC back as it is now, without its free space. About ${gb(total)} before compression, a few minutes in total. Keep the files together:</p>` +
      `<ul class="files">` + items.map(([i, label]) => `<li><a class="dl" href="api/storage/backup/${i}">${esc(i)}</a> ${esc(label)}</li>`).join("") +
      `<li><a class="dl" href="api/storage/backup/restore">RESTORE.txt</a> how to write them back</li></ul>` +
      `<p class="note">All at once from a computer (asks for the password):</p>` +
      `<pre class="mono">read -rsp 'ChirpStack password: ' P; echo\nfor i in ${items.map(([i]) => i).join(" ")} restore; do\n  curl -fOJ -u "admin:$P" http://${esc(location.host)}/api/storage/backup/$i || break\ndone</pre>` +
      `<p><b>Full raw copy</b>: <a class="dl" href="api/storage/backup/full">full</a>, every sector of the ${gb(d.emmc_bytes)} eMMC, old deleted data included. ` +
      `<span class="tbad">Takes a long time</span>: 30 minutes to several hours, and up to tens of GB (a used factory eMMC gave 36 GB). Only needed if you want an exact copy.</p>` +
      `</details>`;
  }

  if (d.boot === "sd" && d.emmc === "present" && !installing) {
    h += `<details><summary>Install onto the eMMC</summary>` +
      `<p>Copies this system, with its settings and ChirpStack data, from the SD card onto the eMMC, and the gateway then runs from there ` +
      `(the eMMC lasts far longer than a card under constant writes). Layout: two system partitions (A/B, for updates) and a data partition for <span class="mono">/var/lib</span>.</p>` +
      `<div class="badbox">This <b>erases the whole eMMC</b>${d.content === "factory" ? ", the Bobcat factory system included. Download the backup above first if you may want it back" : ""}.</div>` +
      `<p class="note">When it is done: power off, take the SD card out, power on. With a card inserted the gateway still starts from the card, so the card stays a way back.</p>` +
      `<p><label>Type <b>ERASE</b> to confirm: <input type="text" id="erase" autocomplete="off" size="8"></label> ` +
      `<button class="danger" id="install" disabled>Erase the eMMC and install</button></p><p class="note" id="install-msg"></p></details>`;
  } else if (d.boot === "emmc") {
    h += `<p class="note">To reinstall, boot a card with a new image (it starts before the eMMC), then use this page from there.</p>`;
  }

  const openNow = [...document.querySelectorAll("#storage details")].map(x => x.open);
  const typed = $("erase") ? $("erase").value : "";
  $("storage").innerHTML = h;
  document.querySelectorAll("#storage details").forEach((x, i) => { if (openNow[i] !== undefined) x.open = openNow[i]; });
  if ($("erase")) {
    $("erase").value = typed;
    const sync = () => { $("install").disabled = $("erase").value !== "ERASE"; };
    $("erase").addEventListener("input", sync); sync();
    $("install").addEventListener("click", startInstall);
  }
}

async function startInstall() {
  const msg = $("install-msg");
  $("install").disabled = true;
  try {
    // Ask for the login first (the browser shows its dialog).
    let r = await fetch("api/storage/login", { cache: "no-store" });
    if (r.ok) r = await fetch("api/storage/install", { method: "POST", body: "confirm=ERASE",
      headers: { "Content-Type": "application/x-www-form-urlencoded" } });
    msg.textContent = r.ok ? "Started." : await r.text();
  } catch (e) { msg.textContent = e.message; }
  storage();
}

async function storage() {
  clearTimeout(storageTimer);
  try {
    const r = await fetch("api/storage", { cache: "no-store" });
    if (r.ok) renderStorage(await r.json());
  } catch (e) { /* the status card already shows a dead gateway */ }
  storageTimer = setTimeout(storage, installing ? 2000 : 30000);
}
storage();
</script>
