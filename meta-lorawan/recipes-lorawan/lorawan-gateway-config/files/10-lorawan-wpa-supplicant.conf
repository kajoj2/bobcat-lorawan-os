# SPDX-License-Identifier: MIT
# wpa_supplicant@wlan0 is enabled in the image but only starts once the device has a Wi-Fi configuration. It is
# on the data partition (/var/lib/lorawan-wifi), as an A/B slot's root file system is read-only; one in the old
# place (/etc/wpa_supplicant) is moved there once by lorawan-wifi-migrate.service.
[Unit]
ConditionPathExists=/var/lib/lorawan-wifi/wpa_supplicant-%I.conf
After=lorawan-wifi-migrate.service

[Service]
ExecStart=
ExecStart=/usr/sbin/wpa_supplicant -c/var/lib/lorawan-wifi/wpa_supplicant-%I.conf -i%I
