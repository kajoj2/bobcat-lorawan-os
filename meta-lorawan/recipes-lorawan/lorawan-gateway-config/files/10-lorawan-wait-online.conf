# Online as soon as one interface is: the cable or Wi-Fi, whichever the gateway has. By default
# systemd-networkd-wait-online waits for every managed link, so a gateway on the cable without Wi-Fi set up
# (wlan0 stays "configuring") or on Wi-Fi without a cable (eth0 "no-carrier") failed it after 2 minutes, and
# Mosquitto and ChirpStack (ordered after network-online.target) started late.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
