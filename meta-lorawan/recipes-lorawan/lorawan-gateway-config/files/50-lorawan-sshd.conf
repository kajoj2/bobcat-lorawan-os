# SPDX-License-Identifier: MIT
# Keys only. The root account has no password for the serial console; it must never be usable over the network.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin prohibit-password
# Keys in the home directory, plus a file on the data partition: an A/B slot's root file system is read-only, so
# keys added later go there (one per line, as authorized_keys).
AuthorizedKeysFile .ssh/authorized_keys /var/lib/lorawan-ssh/authorized_keys
