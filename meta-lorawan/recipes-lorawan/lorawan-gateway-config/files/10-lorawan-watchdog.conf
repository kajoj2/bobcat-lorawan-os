# SPDX-License-Identifier: MIT
# Hardware watchdog: systemd pets it, so a hung kernel or PID 1 reboots the gateway instead of leaving it dead in a
# cupboard. RebootWatchdogSec bounds a reboot that hangs. Without a watchdog device (e.g. QEMU) systemd skips it.
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=10min
