# Mosquitto on the gateway (read instead of mosquitto.conf, see 10-lorawan-mosquitto.conf). No listener is set, so
# Mosquitto keeps its default: port 1883 on localhost only. The gateway's panel writes the optional bridge to
# Home Assistant's broker into the directory below (docs/home-assistant.md).
include_dir /var/lib/lorawan-mqtt-bridge
