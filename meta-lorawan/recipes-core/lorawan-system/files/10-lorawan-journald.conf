# Limits for a journal kept on disk (an A/B gateway keeps it on the data partition, docs/updates.md); a system
# without /var/log/journal keeps it in RAM as before (RuntimeMaxUse, 10% of /run by default).
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=3month
