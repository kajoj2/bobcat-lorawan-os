# SPDX-License-Identifier: MIT
# A small, headless systemd distro for LoRaWAN gateways.

DISTRO = "lorawan-os"
DISTRO_NAME = "LoRaWAN Gateway OS"
# A release sets it from its tag (.github/workflows/release.yml), other builds are "dev". The update bundle's
# version, which the panel shows for each slot, is this plus the build time, or just the release's version.
DISTRO_VERSION ?= "dev"
DISTRO_CODENAME = "first-light"
SDK_VENDOR = "-lorawansdk"
TARGET_VENDOR = "-lorawan"
MAINTAINER = "bobcat-lorawan-os contributors"

INIT_MANAGER = "systemd"

# No graphics, no audio. ipv4/ipv6, Wi-Fi and Bluetooth for the boards that have them.
# No "ext2" (it only adds disk tools to package groups we do not use) and no "pam" (sshd takes keys, the console
# login is shadow's own; nothing on a gateway needs pluggable authentication or systemd's user sessions).
DISTRO_FEATURES = "acl ipv4 ipv6 largefile seccomp usbgadget usbhost wifi bluetooth xattr zeroconf"
DISTRO_FEATURES:append = " systemd usrmerge"
DISTRO_FEATURES_OPTED_OUT += "pulseaudio gobject-introspection-data"

# systemd-networkd + resolved + timesyncd, no NetworkManager
PACKAGECONFIG:append:pn-systemd = " networkd resolved timesyncd"
# journald is the only log: no busybox syslogd next to it. With it installed, it took /dev/log and everything
# logged through syslog (Concentratord, the MQTT Forwarder) went to /var/log/messages instead of the journal.
# packagegroup-core-boot takes it from VIRTUAL-RUNTIME_base-utils-syslog; VIRTUAL-RUNTIME_syslog is the same for
# the larger package groups.
VIRTUAL-RUNTIME_base-utils-syslog = ""
VIRTUAL-RUNTIME_syslog = ""

# The full GNU tools instead of busybox: scripts and people on a shell get the commands and options they know
# (busybox had no base64, timeout, printenv, head -c, od -A, find -delete, dd conv=fsync, install, ...).
# packagegroup-lorawan-base-utils lists them; login and hwclock come from shadow and util-linux.
VIRTUAL-RUNTIME_base-utils = "packagegroup-lorawan-base-utils"
VIRTUAL-RUNTIME_base-utils-hwclock = "util-linux-hwclock"
VIRTUAL-RUNTIME_login_manager = "shadow-base"

# Reproducible, smaller images
INHERIT += "rm_work"
IMAGE_LINGUAS = ""
LICENSE_FLAGS_ACCEPTED ?= ""

# No package feed by default; images are updated as a whole.
PACKAGE_CLASSES ?= "package_ipk"
