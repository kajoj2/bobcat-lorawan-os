# SPDX-License-Identifier: MIT
# meta-lorawan: a self-contained LoRaWAN gateway (ChirpStack Concentratord + MQTT Forwarder + ChirpStack network
# server) as a Yocto distro and image. Board independent; the board layer only provides the hardware.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "lorawan"
BBFILE_PATTERN_lorawan = "^${LAYERDIR}/"
BBFILE_PRIORITY_lorawan = "8"

# meta-oe: redis, nodejs, zeromq, protobuf; meta-networking: mosquitto; meta-python: needed by meta-networking
LAYERDEPENDS_lorawan = "core openembedded-layer networking-layer meta-python"
LAYERSERIES_COMPAT_lorawan = "wrynose"
