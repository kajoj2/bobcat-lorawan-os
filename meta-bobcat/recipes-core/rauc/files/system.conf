# SPDX-License-Identifier: MIT
# RAUC on the Bobcat G285: two system slots on the eMMC, chosen by U-Boot (docs/updates.md).
[system]
compatible=@MACHINE@
bootloader=uboot
# Slot status and RAUC's own data on the data partition (/var/lib), shared by both slots
data-directory=/var/lib/rauc

[keyring]
path=ca.cert.pem
# The signing certificate must be meant for code signing (tools/rauc-keys.sh)
check-purpose=codesign

[handlers]
# Carries the gateway's identity and network settings over to the new slot
post-install=/usr/libexec/bobcat-rauc-post-install

[slot.rootfs.0]
device=/dev/disk/by-partlabel/system_a
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/disk/by-partlabel/system_b
type=ext4
bootname=B
resize=true
