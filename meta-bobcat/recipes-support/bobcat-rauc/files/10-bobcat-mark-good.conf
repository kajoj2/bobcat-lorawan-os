# SPDX-License-Identifier: MIT
# A slot is good once the way to update it again works: network, SSH and the panel (lorawan-agent). If the panel
# does not come up, the slot is not marked, and after three boots U-Boot goes back to the other one.
[Unit]
Requires=lorawan-agent.service
After=lorawan-agent.service systemd-networkd.service sshd.socket
