# SPDX-License-Identifier: MIT
#@TYPE: Machine
#@NAME: Bobcat Miner 300 (G285)
#@DESCRIPTION: Bobcat Miner 300 Helium hotspot, board revision G285-V1.0: Rockchip RK3566, 2 GB LPDDR4X, 64 GB eMMC,
#@DESCRIPTION: 100 Mbit Ethernet (RMII, Motorcomm YT8512B), BCM43430 Wi-Fi/BT, SX1302 LoRa card on SPI1.
# Serial numbers of this revision start with "285". Hardware notes: docs/hardware-g285.md.

MACHINEOVERRIDES =. "bobcat:"

# Plain Image + DTB on the root file system, booted by U-Boot's extlinux support. Simpler to inspect and to swap a
# DTB during bring-up than a FIT image. Has to be set before rockchip-defaults.inc is read.
RK_KERNEL_FITIMAGE = "False"
KERNEL_IMAGETYPE = "Image"

require conf/machine/include/rk3566.inc

# After rk3566.inc, which sets the rkbin blob as the provider.
PREFERRED_PROVIDER_trusted-firmware-a = "${@'trusted-firmware-a' if d.getVar('BOBCAT_TFA') == 'upstream' else 'rockchip-rkbin-tf-a'}"
PREFERRED_VERSION_trusted-firmware-a ?= "2.14.%"

KERNEL_DEVICETREE = "rockchip/rk3566-bobcat-g285.dtb"

# EXPERIMENTAL boot firmware (branch experimental/boot-firmware, docs/experimental-boot-firmware.md). Each part can
# be switched back on its own, e.g. in local.conf, to find which one a board does not like:
#   BOBCAT_UBOOT    "board": U-Boot with this board's device tree (LEDs, recovery button, USB mass storage);
#                   "generic": mainline's generic-rk3568_defconfig, as on main.
#   BOBCAT_TFA      "upstream": TF-A (BL31) built from source by meta-arm; "rkbin": Rockchip's BL31 blob, as on main.
#   BOBCAT_DDR_MHZ  LPDDR4X clock written into Rockchip's DDR blob; "1056" leaves the blob as it is (main).
BOBCAT_UBOOT ?= "board"
BOBCAT_TFA ?= "upstream"
BOBCAT_DDR_MHZ ?= "1332"

# U-Boot: boots from SD or eMMC (SD first) with the console on UART2 at 1500000 baud. The kernel gets its device
# tree through extlinux.conf either way.
UBOOT_MACHINE = "${@'bobcat-g285-rk3566_defconfig' if d.getVar('BOBCAT_UBOOT') == 'board' else 'generic-rk3568_defconfig'}"

SERIAL_CONSOLES = "1500000;ttyS2"

MACHINE_FEATURES += "ext2 rtc usbgadget wifi bluetooth"

# The SX1302 card, as ChirpStack Concentratord names it (model added by meta-lorawan's Concentratord patch).
LORAWAN_CONCENTRATOR_MODEL = "bobcat_miner300_g285"

# Without a FIT image the kernel itself has to be on the root file system.
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "kernel-image"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules linux-firmware-bcm43430 bobcat-wifibt-firmware"

# Wi-Fi (BCM43430A1 on an AzureWave NM372): with the firmware's own 4-way handshake (FWSUP) and SAE enabled, the
# module associates with a WPA2/WPA3 transition AP but no EAPOL frame ever reaches wpa_supplicant ("Authentication
# timed out"). Leave both to wpa_supplicant (seen on the board 2026-11-17).
KERNEL_MODULE_PROBECONF += "brcmfmac"
module_conf_brcmfmac = "options brcmfmac feature_disable=0x82000"
