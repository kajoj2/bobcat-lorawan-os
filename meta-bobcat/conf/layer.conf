# SPDX-License-Identifier: MIT
# meta-bobcat: board support for Bobcat Miner 300 Helium hotspots (Rockchip RK3566 revisions).

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "bobcat"
BBFILE_PATTERN_bobcat = "^${LAYERDIR}/"
BBFILE_PRIORITY_bobcat = "7"

LAYERDEPENDS_bobcat = "core rockchip rauc"
LAYERSERIES_COMPAT_bobcat = "wrynose"
