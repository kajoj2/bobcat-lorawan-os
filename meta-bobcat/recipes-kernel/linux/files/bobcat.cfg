# SPDX-License-Identifier: MIT
# Peripherals of the Bobcat RK3566 boards, on top of the arm64 defconfig (most are already in it; listed here so the
# board does not depend on what defconfig happens to carry).

# PMIC RK809, CPU regulator TCS4525, IO domains, thermal
CONFIG_MFD_RK8XX_I2C=y
CONFIG_REGULATOR_RK808=y
CONFIG_REGULATOR_FAN53555=y
CONFIG_COMMON_CLK_RK808=y
CONFIG_ROCKCHIP_IODOMAIN=y
CONFIG_ROCKCHIP_THERMAL=y
CONFIG_ROCKCHIP_SARADC=y

# eMMC, SD, SDIO
CONFIG_MMC_DW=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_MMC_SDHCI_OF_DWCMSHC=y
CONFIG_PWRSEQ_SIMPLE=y

# Ethernet: GMAC1 in RMII mode, Motorcomm YT8512B PHY
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_MOTORCOMM_PHY=y

# LoRa concentrator: SX1302 on SPI1 through spidev, its reset and power lines through the GPIO character device
CONFIG_SPI=y
CONFIG_SPI_ROCKCHIP=y
CONFIG_SPI_SPIDEV=y
CONFIG_GPIOLIB=y
CONFIG_GPIO_CDEV=y

# Hardware random number generator (RK3568 TRNG) and the button on SARADC channel 0
CONFIG_HW_RANDOM=y
CONFIG_HW_RANDOM_ROCKCHIP=y
CONFIG_KEYBOARD_ADC=y

# RTC HYM8563 (CR1220 backed)
CONFIG_RTC_DRV_HYM8563=y

# Wi-Fi / Bluetooth: BCM43430 on SDIO + UART1
CONFIG_CFG80211=m
CONFIG_BRCMFMAC=m
CONFIG_BRCMFMAC_SDIO=y
CONFIG_BT=m
CONFIG_BT_HCIUART=m
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_BT_HCIUART_BCM=y
CONFIG_SERIAL_DEV_BUS=y

# LEDs
CONFIG_LEDS_GPIO=y
CONFIG_LEDS_TRIGGER_HEARTBEAT=y
CONFIG_LEDS_TRIGGER_NETDEV=y

# Rear micro-USB as a USB gadget (serial console / network for maintenance)
CONFIG_USB_DWC3=y
CONFIG_USB_GADGET=y
CONFIG_USB_CONFIGFS=m
CONFIG_USB_CONFIGFS_ACM=y
CONFIG_USB_CONFIGFS_NCM=y
CONFIG_PHY_ROCKCHIP_INNO_USB2=y

# Watchdog
CONFIG_WATCHDOG=y
CONFIG_DW_WATCHDOG=y
