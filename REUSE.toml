# SPDX-License-Identifier: MIT
# Copyright and licensing for files without (complete) SPDX headers (https://reuse.software/spec-3.3/).
# Files carry their own SPDX-License-Identifier; this supplies the copyright line for all of them, and the license
# for files that cannot carry a header (generated crate lists, patches, lock files).
version = 1

[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 bobcat-lorawan-os contributors"
SPDX-License-Identifier = "MIT"

# Linux kernel patches are derived from GPL-2.0+ kernel code.
[[annotations]]
path = "meta-bobcat/recipes-kernel/linux/files/patches/*.patch"
precedence = "override"
SPDX-FileCopyrightText = "2026 bobcat-lorawan-os contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"
